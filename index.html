<style>
  :root{
    --bg: #ffffff;
    --text: #1a1a1a;
    --muted: #5c5c5c;
    --accent: #25D366;
    --accent-dark: #1ebe5b;
    --card-shadow: rgba(0,0,0,0.08);
    --max-width: 420px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
  }

  body{
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 48px 20px;
  }

  .card{
    width: 100%;
    max-width: var(--max-width);
    text-align: center;
  }

  .avatar{
    width: 140px;
    height: 140px;
    border-radius: 50%;
    object-fit: cover;
    margin: 0 auto 24px;
    display: block;
    box-shadow: 0 8px 24px var(--card-shadow);
    background: #eee;
  }

  h1{
    font-size: 1.6rem;
    font-weight: 700;
    margin: 0 0 16px;
    line-height: 1.3;
  }

  hr{
    border: none;
    border-top: 1px solid #e5e5e5;
    margin: 20px 0;
  }

  p.subtitle{
    color: var(--muted);
    font-size: 1rem;
    line-height: 1.5;
    margin: 0 0 32px;
  }

  .whatsapp-btn{
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 16px 24px;
    background: var(--accent);
    color: #fff;
    font-weight: 600;
    font-size: 1rem;
    text-decoration: none;
    border-radius: 10px;
    transition: background 0.2s ease, transform 0.15s ease;
    margin-bottom: 32px;
  }

  .whatsapp-btn:hover{
    background: var(--accent-dark);
    transform: translateY(-1px);
  }

  .socials{
    display: flex;
    justify-content: center;
    gap: 24px;
  }

  .socials a{
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: #f4f4f4;
    transition: background 0.2s ease, transform 0.15s ease;
  }

  .socials a:hover{
    background: #e8e8e8;
    transform: translateY(-2px);
  }

  .socials svg{
    width: 20px;
    height: 20px;
    fill: currentColor;
  }

  footer{
    margin-top: 40px;
    font-size: 0.75rem;
    color: #b3b3b3;
  }

  footer a{
    color: #b3b3b3;
    text-decoration: none;
  }

  footer a:hover{
    text-decoration: underline;
  }

  @media (max-width: 380px){
    .avatar{ width: 110px; height: 110px; }
    h1{ font-size: 1.35rem; }
  }
</style>
